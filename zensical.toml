# ocai documentation site — built with Zensical (https://zensical.org).
#
# Local workflow (Zensical lives in the "docs" dependency group, so always run
# it through uv):
#
#   uv run --group docs zensical serve   # live preview at http://127.0.0.1:8000
#   uv run --group docs zensical build   # render the static site into ./site
#
# ----------------------------------------------------------------------------
# Project
# ----------------------------------------------------------------------------
[project]
site_name = "ocai"
site_description = "One Common interface for AI — a single, stable, provider-neutral API in front of every AI provider."
site_author = "The ocai authors"

# Canonical URL: the site is published to GitHub Pages by
# .github/workflows/docs.yml on every push to main. Several features (instant
# navigation, custom error pages) rely on it.
site_url = "https://ocarinow.github.io/ocai/"
repo_url = "https://github.com/ocarinow/ocai"
repo_name = "ocarinow/ocai"

copyright = """
ocai is source-available under the Functional Source License (FSL-1.1-ALv2).
"""

