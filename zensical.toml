# (navigation.tabs): the libraries, the platform, the spec, and the
# constitution are separate information spaces on one site. Section index
# pages (navigation.indexes) are the README.md of each directory. docs/plans/archive/ (pre-rearchitecture plans)
# is intentionally left out of the nav; it still builds and is reachable from
# the roadmap page.
