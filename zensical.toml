# ocai documentation site — built with Zensical (https://zensical.org).
#
# Local workflow (Zensical lives in the "docs" dependency group, so always run
# it through uv):
#
#   uv run --group docs zensical serve   # live preview at http://127.0.0.1:8000
#   uv run --group docs zensical build   # render the static site into ./site
#
# ----------------------------------------------------------------------------
# Project
# ----------------------------------------------------------------------------
[project]
site_name = "ocai"
site_description = "One Common interface for AI — a single, stable, provider-neutral API in front of every AI provider."
site_author = "The ocai authors"

# Canonical URL: the site is published to GitHub Pages by
# .github/workflows/docs.yml on every push to main. Several features (instant
# navigation, custom error pages) rely on it.
site_url = "https://ocarinow.github.io/ocai/"
repo_url = "https://github.com/ocarinow/ocai"
repo_name = "ocarinow/ocai"

copyright = """
ocai is source-available under the Functional Source License (FSL-1.1-ALv2).
"""

# Explicit navigation. Top-level entries render as header TABS
# (navigation.tabs): the libraries, the platform, the spec, and the
# constitution are separate information spaces on one site. Section index
# pages (navigation.indexes) are the README.md of each directory. docs/plans/archive/ (pre-rearchitecture plans)
# is intentionally left out of the nav; it still builds and is reachable from
# the roadmap page.
nav = [
  { "Home" = "index.md" },
  { "Libraries" = [
    "libraries/README.md",
    { "Python" = [
      "libraries/python/README.md",
      { "Writing a plugin" = "writing-a-plugin.md" },
    ] },
    { "TypeScript" = "libraries/typescript.md" },
    { "Go" = "libraries/go.md" },
  ] },
  { "Platform" = [
    "platform/README.md",
  ] },
  { "Spec" = [
    "spec/README.md",
    { "Providers" = [
      "providers/README.md",
      { "Feature matrix" = "provider-feature-matrix.md" },
      { "OpenAI" = "providers/openai.md" },
      { "Anthropic" = "providers/anthropic.md" },
      { "Google Gemini" = "providers/google-gemini.md" },
      { "Mistral" = "providers/mistral.md" },
      { "Research: feature matrix" = "providers/feature-matrix.md" },
      { "Research: common interface" = "providers/common-interface.md" },
    ] },
  ] },
  { "Architecture" = "architecture.md" },
  { "Roadmap" = [
    "plans/README.md",
    { "Core modernization" = "plans/core-modernization.md" },
    { "WU-20 — Catalog conformance" = "plans/wu-20-catalog-conformance.md" },
    { "Horizon milestones" = "plans/horizon.md" },
    { "Kernel gaps" = "plans/gaps.md" },
    { "M1 — Foundations" = "plans/m1-foundations.md" },
    { "M2 — Streaming" = "plans/m2-streaming.md" },
    { "M3 — Second provider" = "plans/m3-second-provider.md" },
  ] },
  { "Decisions" = [
    "decisions/README.md",
    { "0001 — Agent-neutral repo layout" = "decisions/0001-agent-neutral-repo-layout.md" },
    { "0002 — Branch protection and typing gate" = "decisions/0002-branch-protection-and-typing-gate.md" },
    { "0003 — Ordered-item modernization" = "decisions/0003-ordered-item-modernization.md" },
    { "0004 — Catalog composition and evidence" = "decisions/0004-catalog-composition-and-evidence.md" },
  ] },
]

# Link validation. architecture.md (and pages quoting it) use bracketed status
# badges — [frozen-candidate], [provisional], [stub] — which Markdown would
# otherwise flag as unresolved reference-style links. Everything else (missing
# pages, bad anchors, unused definitions) stays a build warning.
[project.validation]
unresolved_references = false

# ----------------------------------------------------------------------------
# Theme
# ----------------------------------------------------------------------------
[project.theme]
logo = "assets/ocai.svg"
language = "en"

features = [
    "announce.dismiss",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.sections",
    "navigation.tabs",
    "navigation.tabs.sticky",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

# ----------------------------------------------------------------------------
# Markdown extensions
#
# These mirror Zensical's default starter set; the starter pages below rely on
# them (admonitions, superfences/mermaid, content tabs, math, emoji, …).
# Read more: https://zensical.org/docs/setup/extensions/
# ----------------------------------------------------------------------------
[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.arithmatex]
generic = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]
