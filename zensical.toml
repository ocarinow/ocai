# ocai documentation site — built with Zensical (https://zensical.org).
#
# Local workflow (Zensical lives in the "docs" dependency group, so always run
# it through uv):
#
#   uv run --group docs zensical serve   # live preview at http://127.0.0.1:8000
#   uv run --group docs zensical build   # render the static site into ./site
#
# ----------------------------------------------------------------------------
# Project
# ----------------------------------------------------------------------------
[project]
site_name = "ocai"
site_description = "One Common interface for AI — a single, stable, provider-neutral API in front of every AI provider."
site_author = "The ocai authors"

# Canonical URL: the site is published to GitHub Pages by
# .github/workflows/docs.yml on every push to main. Several features (instant
# navigation, custom error pages) rely on it.
site_url = "https://ocarinow.github.io/ocai/"
repo_url = "https://github.com/ocarinow/ocai"
repo_name = "ocarinow/ocai"

copyright = """
ocai is source-available under the Functional Source License (FSL-1.1-ALv2).
"""

# The public site contains user documentation only. Contributor, design,
# research, architecture and roadmap sources are outside this publication root.
docs_dir = "docs/user"
nav = [
  { "Home" = "index.md" },
  { "Python" = [
    "libraries/python/README.md",
    { "Streaming and async" = "guides/streaming.md" },
    { "Tools and structured output" = "guides/tools.md" },
    { "Conversion and fidelity" = "guides/fidelity.md" },
    { "Providers and hosts" = "guides/providers.md" },
    { "Errors and troubleshooting" = "guides/errors.md" },
    { "Gateway integration" = "gateway-integration.md" },
    { "Writing a plugin" = "writing-a-plugin.md" },
  ] },
  { "Support" = [
    "provider-feature-matrix.md",
    { "Languages and packages" = "libraries/README.md" },
    { "TypeScript availability" = "libraries/typescript.md" },
    { "Go availability" = "libraries/go.md" },
    { "Schemas and wire contracts" = "spec/README.md" },
  ] },
  { "Platform" = [
    "platform/README.md",
    { "Management client" = "platform/client.md" },
    { "Operating the preview" = "platform/operations.md" },
  ] },
  { "API reference" = [
    "reference/README.md",
    { "ocai.anthropic" = "reference/ocai-anthropic.md" },
    { "ocai.aws" = "reference/ocai-aws.md" },
    { "ocai.bedrock" = "reference/ocai-bedrock.md" },
    { "ocai.chat" = "reference/ocai-chat.md" },
    { "ocai.convert" = "reference/ocai-convert.md" },
    { "ocai.core" = "reference/ocai-core.md" },
    { "ocai.deepseek" = "reference/ocai-deepseek.md" },
    { "ocai.embedding" = "reference/ocai-embedding.md" },
    { "ocai.openai" = "reference/ocai-openai.md" },
    { "ocai.runtime" = "reference/ocai-runtime.md" },
    { "ocai.vectorstore" = "reference/ocai-vectorstore.md" },
    { "ocai.wire" = "reference/ocai-wire.md" },
    { "Management HTTP API" = "reference/management.md" },
  ] },
]

# Link validation. architecture.md (and pages quoting it) use bracketed status
# badges — [frozen-candidate], [provisional], [stub] — which Markdown would
# otherwise flag as unresolved reference-style links. Everything else (missing
# pages, bad anchors, unused definitions) stays a build warning.
[project.validation]
unresolved_references = false

# ----------------------------------------------------------------------------
# Theme
# ----------------------------------------------------------------------------
[project.theme]
logo = "assets/ocai.svg"
language = "en"

features = [
    "announce.dismiss",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.sections",
    "navigation.tabs",
    "navigation.tabs.sticky",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

# ----------------------------------------------------------------------------
# Markdown extensions
#
# These mirror Zensical's default starter set; the starter pages below rely on
# them (admonitions, superfences/mermaid, content tabs, math, emoji, …).
# Read more: https://zensical.org/docs/setup/extensions/
# ----------------------------------------------------------------------------
[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
toc_depth = 3
[project.markdown_extensions.pymdownx.arithmatex]
generic = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]
