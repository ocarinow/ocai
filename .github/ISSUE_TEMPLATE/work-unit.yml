name: Work unit card
description: The board card for one WU. Scope and done-criteria live in docs/plans/, never here.
title: "WU-NN: <imperative title, identical to the plan row>"
labels: ["work-unit"]
body:
  - type: markdown
    attributes:
      value: |
        This issue is a **card**, not a definition. The WU entry (Scope, Done, Deps, Architecture, Freeze, Decision, Open) is written with the `wu-define` skill into a plan file under `docs/plans/` and reviewed in a PR. Keep this body to the fields below. This repository is public: no session links, AI footers, agent ids, or local paths.
  - type: input
    id: plan
    attributes:
      label: Plan entry
      description: Link to the WU entry in docs/plans/ (file + heading anchor) on main.
      placeholder: https://github.com/ocarinow/ocai/blob/main/docs/plans/<file>.md#wu-nn--title
    validations:
      required: true
  - type: dropdown
    id: owner
    attributes:
      label: Owner
      options: [Codex, Claude, maintainer, unassigned]
      default: 3
    validations:
      required: true
  - type: dropdown
    id: tier
    attributes:
      label: Tier
      description: From docs/capabilities/README.md sequencing; "program" for the current modernization/gateway program.
      options: [program, "1 — chat completeness and hosts", "2 — telemetry and catalog data", "3 — retrieval", "4 — new generation capabilities", "5 — jobs and files substrate", "6 — platform-tier"]
      default: 0
    validations:
      required: true
