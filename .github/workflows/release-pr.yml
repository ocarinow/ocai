name: Release PR

# One branch, one standing Release PR (ADR 0010, docs/releasing.md). On every
# push to main that is not itself the release merge, run `knope
# prepare-release`: bump the versions of packages with pending change files,
# write their CHANGELOG.md, consume the change files, and open or update the
# PR from branch `release` into main. Merging that PR is the stable release
# (release.yml tags and publishes). With no pending change files nothing
# changes and no PR is opened.
#
# The PR is created with RELEASE_TOKEN (a token with repo scope; the default
# token's PRs do not trigger the required checks).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-pr
  cancel-in-progress: true

jobs:
  prepare:
    name: prepare release PR
    if: "!startsWith(github.event.head_commit.message, 'Release:')"
    runs-on: ubuntu-latest
    steps:
      # This checkout keeps its credentials on purpose: create-pull-request pushes
      # the `release` branch with them. zizmor: ignore[artipacked]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - uses: knope-dev/action@19617851f9f13ab2f27a05989c55efb18aca3675 # v2.1.2
        with:
          version: 0.23.2

      - name: Prepare the release (versions, changelogs, consume change files)
        run: knope prepare-release --verbose

      # uv.lock records every workspace member's version; the bump above must
      # travel with its lockfile or `uv sync --locked` fails on the Release PR.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - run: uv python install 3.13
      - name: Refresh the lockfile for the bumped versions
        run: uv lock

      - name: Describe the release
        id: describe
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          {
            echo "## Goal"; echo
            echo "Release the versions below. Merging this pull request tags and publishes them (ADR 0010)."; echo
            echo "## How"; echo
            git diff --cached --name-only -- 'python/packages/*/pyproject.toml' | while read -r f; do
              v=$(grep -E '^version = ' "$f" | head -1 | sed -E 's/version = "([^"]+)".*/\1/')
              n=$(grep -E '^name = ' "$f" | head -1 | sed -E 's/name = "([^"]+)".*/\1/')
              echo "- \`$n\` → \`$v\` (tag \`$n/v$v\`)"
            done
            echo; echo "knope computed the versions and the changelog sections from the pending change files, which this pull request consumes (CI run $RUN_ID)."; echo
            echo "## Impact"; echo
            echo "Publishes the listed packages to PyPI and creates their tags and GitHub Releases. No source code changes."
          } > /tmp/release_pr_body.md
          echo "body=/tmp/release_pr_body.md" >> "$GITHUB_OUTPUT"

      - name: Open or update the Release PR
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          branch: release
          base: main
          delete-branch: true
          commit-message: "Release: bump versions and changelogs from change files"
          title: "Release: bump versions and changelogs from change files"
          body-path: ${{ steps.describe.outputs.body }}
          labels: release
