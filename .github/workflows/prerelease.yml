name: Pre-release

# Pre-releases (ADR 0010, docs/releasing.md). Every merge into main that is
# not the release merge publishes an ALPHA of each package with pending change
# files: knope computes the target version from the change files, the CI run
# number makes the alpha unique and monotonic (`0.2.0a123`), nothing is
# committed or tagged, change files are kept. A RELEASE CANDIDATE is the same
# on demand (`gh workflow run prerelease.yml -f kind=rc`). Pre-release
# versions are never installed by default by pip or uv.

on:
  push:
    branches: [main]
    paths: ["python/packages/**", ".changeset/**"]
  workflow_dispatch:
    inputs:
      kind:
        description: alpha or rc
        type: choice
        options: [alpha, rc]
        default: rc

permissions:
  contents: read

concurrency:
  group: prerelease
  cancel-in-progress: true

jobs:
  plan:
    name: pre-release plan
    if: "!startsWith(github.event.head_commit.message, 'Release:')"
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      label: ${{ steps.plan.outputs.label }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: knope-dev/action@19617851f9f13ab2f27a05989c55efb18aca3675 # v2.1.2
        with:
          version: 0.23.2
      - name: Target versions from the pending change files
        id: plan
        env:
          KIND: ${{ github.event.inputs.kind || 'alpha' }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          kind="$KIND"
          label=$([ "$kind" = "rc" ] && echo rc || echo a)
          knope prerelease --prerelease-label "$kind" --dry-run > plan.txt 2>&1 || true
          # lines: "Would add the following to python/packages/<dir>/pyproject.toml: 0.2.0-alpha.0"
          matrix=$(grep -E 'pyproject.toml: ' plan.txt \
            | sed -E 's#Would add the following to (python/packages/[^/]+)/pyproject.toml: ([0-9]+\.[0-9]+\.[0-9]+).*#{"dir":"\1","version":"\2'"$label$RUN_NUMBER"'"}#' \
            | jq -s -c '.')
          echo "matrix=${matrix:-[]}" >> "$GITHUB_OUTPUT"
          echo "label=$kind" >> "$GITHUB_OUTPUT"
          echo "plan: ${matrix:-[]}"

  publish:
    name: publish ${{ matrix.item.dir }} ${{ matrix.item.version }}
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    environment: pypi
    # Trusted publishing needs the OIDC token; only this job gets it.
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        item: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No cache in a publishing job: a poisoned cache would ship (zizmor cache-poisoning).
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - run: uv python install 3.13
      - name: Set the pre-release version (not committed)
        env:
          DIR: ${{ matrix.item.dir }}
          VERSION: ${{ matrix.item.version }}
        run: uv version --project "$DIR" "$VERSION"
      - name: Build
        env:
          DIR: ${{ matrix.item.dir }}
        run: uv build --project "$DIR" --out-dir dist
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
          print-hash: true
