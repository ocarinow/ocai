name: PR metadata

on:
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * *"
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-metadata-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every PR follows .github/PULL_REQUEST_TEMPLATE.md: WU-NN title, every
  # section present from the first draft, content once ready, a Stacked-on
  # note when the base is not main (AGENTS.md). Required on main.
  pr-hygiene:
    name: pr-hygiene
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Branch names come from the PR author: they reach the script through the
      # environment, never interpolated into it (actionlint: script injection).
      - name: Change files (release intent travels with the change — ADR 0010)
        env:
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          flag=""; [ "$PR_HEAD" = "release" ] && flag="--release-pr"
          python3 scripts/release.py check --base "origin/$PR_BASE" $flag
      - name: Save PR body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n' "$PR_BODY" > /tmp/pr_body.md
      - name: PR hygiene
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          flag=""; [ "$PR_DRAFT" = "true" ] && flag="--draft"
          python3 scripts/pr_check.py --title "$PR_TITLE" --body-file /tmp/pr_body.md --base "$PR_BASE" --author "$PR_AUTHOR" --diff $flag
      # Every WU entry in docs/plans/ follows WU-TEMPLATE.md (offline, no token).
      - name: Plan entries
        run: python3 scripts/board_sync.py lint

  # The repository is public: no commit message, PR title, or PR body may carry
  # an AI session link, an AI attribution footer/trailer, an agent identifier,
  # or a local home path (AGENTS.md "Never publish session or tool metadata").
  # Required status check on main; also runs on every push.
  privacy:
    name: privacy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Save PR title and body
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" > /tmp/pr_text.txt
      - name: Privacy guard (commits + PR text + files)
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            python3 scripts/privacy_check.py --range "origin/$BASE_REF..HEAD" --text /tmp/pr_text.txt
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            python3 scripts/privacy_check.py --range "$BEFORE..HEAD"
          else
            python3 scripts/privacy_check.py --range "HEAD~1..HEAD"
          fi

