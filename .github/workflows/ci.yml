name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  # No `edited`: changing a title or a body neither replays nor replaces the code
  # results of a commit. pr-metadata.yml re-checks the text.
  pull_request:
    types: [opened, synchronize, reopened]
  # Nightly full run on main: catches drift in pinned images, package indexes
  # and advisories that no commit triggered.
  schedule:
    - cron: "41 4 * * *"

# Least privilege: every job here only reads the repository. A job that needs
# more declares it on the job, never here.
permissions:
  contents: read

# New code cancels the obsolete run of the same pull request; main and full
# runs are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides once which suites this change must run (scripts/ci_scope.py). A
  # suite that is not affected never starts. If this job fails, its outputs are
  # empty and every suite runs: the conditions below test for `'false'`, so
  # uncertainty means more validation, never less.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python: ${{ steps.scope.outputs.python }}
      platform: ${{ steps.scope.outputs.platform }}
      docs: ${{ steps.scope.outputs.docs }}
      workflows: ${{ steps.scope.outputs.workflows }}
      semgrep: ${{ steps.scope.outputs.semgrep }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select affected suites
        id: scope
        run: python3 scripts/ci_scope.py

  # The kernel on every supported interpreter. The checks are the git hooks
  # (.pre-commit-config.yaml), so a contributor and CI run one definition.
  python:
    name: ${{ matrix.name }}
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.python != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: python, python: "3.13" }
          - { name: python-next, python: "3.14" }
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install "$UV_PYTHON"

      # --locked: a lockfile that no longer matches pyproject.toml is a failure,
      # never a silent re-resolution on the runner.
      - name: Sync workspace
        run: uv sync --locked

      # Privacy on files, lint, format, lockfile, import contracts, workspace
      # consistency, strict types, plan entries. The workflow audit has its own
      # job below.
      - name: Commit hooks
        env:
          SKIP: workflows
        run: uv run pre-commit run --all-files

      # Tests. The change-file policy and the privacy guard on commits need the
      # pull request's real base and text: pr-metadata.yml runs them.
      - name: Push hooks
        env:
          SKIP: change-files,privacy-commits
        run: uv run pre-commit run --all-files --hook-stage pre-push

      # What ships: every wheel built and opened (no namespace-root __init__,
      # py.typed per portion, license and URLs in METADATA).
      - name: Wheels
        run: uv run python scripts/wheel_check.py

      # Build/install ordinary wheels in a fresh environment: source-path
      # injection would miss broken namespace packaging and entry points.
      - name: Independently installed community plugin
        run: >-
          uv run --no-cache --isolated --no-project --python "$UV_PYTHON"
          --with ./python/packages/ocai-core
          --with ./examples/ocai-contrib-echo --with pytest --with jsonschema
          python -m pytest -c /dev/null --rootdir examples/ocai-contrib-echo --import-mode=importlib
          examples/ocai-contrib-echo/tests -q

  # Provisions PostgreSQL, Keycloak and OpenFGA from pinned digests and drives
  # the built console with Playwright.
  platform:
    name: platform
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.platform != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: platform/services/gateway/uv.lock

      - run: uv python install 3.13

      - run: uv sync --project platform/services/gateway --frozen

      # Missing Docker must fail the integration job, never silently skip integration.
      - name: Verify Docker for platform integration
        run: docker info --format '{{.ServerVersion}}'

      - run: npm ci
        working-directory: platform

      # Browser binaries are keyed on the lockfile (which pins @playwright/test);
      # a hit skips the download and only installs the OS packages it needs.
      - name: Cache Playwright browsers
        id: playwright
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('platform/package-lock.json') }}

      - name: Install Playwright Chromium
        if: steps.playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: platform

      - name: Install Playwright system dependencies (browsers cached)
        if: steps.playwright.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: platform

      - run: uv run --project platform/services/gateway python scripts/check_platform.py

  # The published site builds without a warning. docs.yml deploys it from main.
  docs:
    name: docs
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv python install 3.13
      - run: uv sync --locked --group docs
      - name: Build site
        run: uv run python scripts/docs_check.py

  # The workflows themselves: zizmor (security audit of GitHub Actions
  # workflows) and actionlint (syntax, expressions, shellcheck). Both open
  # source, keyless, pinned.
  workflows:
    name: workflows
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.workflows != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx --from zizmor==1.32.0 zizmor --no-progress --persona regular .github/workflows
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color # 1.7.12

  # Static analysis with Semgrep Community Edition (LGPL, no account, no key):
  # the Python, TypeScript and GitHub Actions rulesets, blocking on findings.
  # Suppressions are inline `# nosemgrep` with a reason on the line above.
  semgrep:
    name: semgrep
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.semgrep != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false
      - name: Semgrep CE
        run: >-
          uvx semgrep==1.185.0 scan --metrics=off --error
          --config p/python --config p/typescript --config p/github-actions
          python scripts tasks examples
          platform/services platform/apps platform/packages/nuxt-platform
          platform/packages/management-client platform/tests .github

  # A pull request may not add a dependency with a known vulnerability or a
  # copyleft license (the repository is FSL; copyleft would leak into it).
  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0, SSPL-1.0
          comment-summary-in-pr: on-failure

  # Nightly only: known vulnerabilities in the platform's npm tree at high
  # severity. Informational on PRs would train everyone to ignore red, so it
  # runs once a day against main and fails that run.
  audit:
    name: audit (nightly)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: npm audit --audit-level=high
        working-directory: platform

  # The one required check for code. It always runs and fails when any job
  # above failed or was cancelled. A job that was skipped because its suite is
  # not affected does not fail it.
  ci:
    name: ci
    needs: [changes, python, platform, docs, workflows, semgrep, dependency-review, audit]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job that ran succeeded
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq '"(failure|cancelled)"'; then
            echo "::error::a job failed or was cancelled"
            exit 1
          fi
