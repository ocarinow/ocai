name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened]
  # Nightly full run on main: catches drift in pinned images, package indexes
  # and advisories that no commit triggered.
  schedule:
    - cron: "41 4 * * *"

# Least privilege: every job here only reads the repository. A job that needs
# more declares it on the job, never here.
permissions:
  contents: read

# Metadata edits use a separate concurrency group and skip only the caller job.
# Required leaf checks are not created or overwritten. Base edits rerun all suites.
# New code cancels obsolete PR code runs; main and full runs are never cancelled.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base == null && 'metadata' || 'code' }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Route before expanding the reusable workflow. Skipped events display this
# static caller name, never an unevaluated expression or a required check name.
jobs:
  checks:
    name: Code checks
    if: github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base != null
    # Same-commit call; pinned actionlint does not yet recognize the $/ spelling.
    uses: ./.github/workflows/ci-checks.yml # zizmor: ignore[self-repository]
