name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

# Path-filtered per language. Every job ALSO triggers on spec/** so that a
# change to the language-neutral source of truth re-runs each implementation's
# conformance suite — the intended cross-language drift alarm.
jobs:
  python:
    name: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Cheap path filter: decide whether the rest of the job should run.
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            run:
              - 'python/**'
              - 'spec/**'
              - 'examples/ocai-contrib-echo/**'
              - 'pyproject.toml'
              - '.github/workflows/ci.yml'

      - name: Install uv
        if: steps.changes.outputs.run == 'true'
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        if: steps.changes.outputs.run == 'true'
        run: uv python install 3.13

      - name: Sync workspace
        if: steps.changes.outputs.run == 'true'
        run: uv sync

      - name: Ruff
        if: steps.changes.outputs.run == 'true'
        run: uv run ruff check

      # Architecture §1 made executable: the layered + forbidden import
      # contracts in the root pyproject [tool.importlinter].
      - name: Import contracts
        if: steps.changes.outputs.run == 'true'
        run: uv run lint-imports

      # Rule 16 for the IDE: pyright strict is what Pylance shows users —
      # nothing may resolve to Unknown. mypy strict is the second opinion.
      - name: Pyright (strict)
        if: steps.changes.outputs.run == 'true'
        run: uv run pyright

      - name: Mypy (strict)
        if: steps.changes.outputs.run == 'true'
        run: uv run mypy

      - name: Pytest
        if: steps.changes.outputs.run == 'true'
        run: uv run pytest

      # Build/install ordinary wheels in a fresh environment: source-path
      # injection would miss broken namespace packaging and entry points.
      - name: Independently installed community plugin
        if: steps.changes.outputs.run == 'true'
        run: >-
          uv run --no-cache --isolated --no-project --python 3.13
          --with ./python/packages/ocai-core
          --with ./examples/ocai-contrib-echo --with pytest --with jsonschema
          python -m pytest -c /dev/null --rootdir examples/ocai-contrib-echo --import-mode=importlib
          examples/ocai-contrib-echo/tests -q

  typescript:
    name: typescript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            run:
              - 'typescript/**'
              - 'spec/**'
      - name: Not yet implemented
        if: steps.changes.outputs.run == 'true'
        run: echo "typescript implementation not yet implemented (scaffold mirrors spec/)"

  go:
    name: go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            run:
              - 'go/**'
              - 'spec/**'
      - name: Not yet implemented
        if: steps.changes.outputs.run == 'true'
        run: echo "go implementation not yet implemented (scaffold mirrors spec/)"
