name: Docs

# Builds the Zensical documentation site. The `docs` job is a required status
# check on main (ADR 0002), so it runs on every pull request and decides
# inside the job whether the docs changed; when they did not, it reports
# success in seconds. A push to main that touches the docs builds again and
# deploys the result to GitHub Pages at https://ocarinow.github.io/ocai/ .
# Deployment runs ONLY on such pushes and ONLY when Pages is enabled on the
# repository (Settings → Pages → Source: GitHub Actions); until then the
# deploy job reports "skipped" instead of failing. No caching on CI, per
# Zensical's publishing guide.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

permissions:
  contents: read

# One Pages deployment at a time (never cancel an in-flight deploy); one live
# build per pull request (a new push cancels the superseded one).
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.changes.outputs.run }}
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # A manual dispatch always builds; otherwise only a docs change does.
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: changes
        with:
          filters: |
            run:
              - 'docs/**'
              - 'zensical.toml'
              - 'pyproject.toml'
              - '.github/workflows/docs.yml'
      - name: Force a build on manual dispatch
        if: github.event_name == 'workflow_dispatch'
        run: echo "forced=true" >> "$GITHUB_OUTPUT"
        id: forced

      - name: Is GitHub Pages enabled on this repository?
        id: pages
        if: steps.changes.outputs.run == 'true' || steps.forced.outputs.forced == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is not enabled; the site builds but will not deploy. Enable it once: Settings → Pages → Source: GitHub Actions."
          fi

      - name: Install uv
        if: steps.changes.outputs.run == 'true' || steps.forced.outputs.forced == 'true'
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Set up Python
        if: steps.changes.outputs.run == 'true' || steps.forced.outputs.forced == 'true'
        run: uv python install 3.13

      - name: Sync docs group
        if: steps.changes.outputs.run == 'true' || steps.forced.outputs.forced == 'true'
        run: uv sync --locked --group docs

      # Zero warnings: a missing nav page or a broken internal link fails the build.
      - name: Build site
        if: steps.changes.outputs.run == 'true' || steps.forced.outputs.forced == 'true'
        run: |
          out=$(uv run --group docs zensical build --clean 2>&1); echo "$out"
          echo "$out" | grep -q "No issues found"

      - name: Upload Pages artifact
        if: (steps.changes.outputs.run == 'true' || steps.forced.outputs.forced == 'true') && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  deploy:
    name: deploy
    if: github.event_name != 'pull_request' && needs.docs.outputs.pages_enabled == 'true'
    needs: docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages is enabled by hand once (the Actions token cannot create the
      # site); this job only runs when the docs job found it enabled.
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: false

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
