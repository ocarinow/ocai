name: Docs

# Deploys the Zensical documentation site to GitHub Pages at
# https://ocarinow.github.io/ocai/ when a push to main changes what the site is
# built from. The build is checked on pull requests by the `docs` job of
# ci.yml; this workflow only publishes. Deployment happens ONLY when Pages is
# enabled on the repository (Settings → Pages → Source: GitHub Actions); until
# then the deploy job reports "skipped" instead of failing. No caching, per
# Zensical's publishing guide.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "zensical.toml"
      - "scripts/docs_*.py"
      - "python/**"
      - "platform/spec/**"
      - "platform/packages/management-client/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

# One Pages deployment at a time; never cancel an in-flight deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs:
    name: docs
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Is GitHub Pages enabled on this repository?
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if gh api "repos/$REPOSITORY/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is not enabled; the site builds but will not deploy. Enable it once: Settings → Pages → Source: GitHub Actions."
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Set up Python
        run: uv python install 3.13

      - name: Sync docs group
        run: uv sync --locked --group docs

      # Zero warnings: a missing nav page or a broken internal link fails the
      # build. Same command as `task docs:check`.
      - name: Build site
        run: uv run python scripts/docs_check.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: deploy
    if: needs.docs.outputs.pages_enabled == 'true'
    needs: docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages is enabled by hand once (the Actions token cannot create the
      # site); this job only runs when the docs job found it enabled.
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: false

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
