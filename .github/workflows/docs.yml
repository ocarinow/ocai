name: Docs

# Builds the Zensical documentation site. The `docs` job is a required status
# check on main (ADR 0002), so it runs on every code event and decides
# inside the job whether the docs changed; when they did not, it reports
# success in seconds. A push to main that touches the docs builds again and
# deploys the result to GitHub Pages at https://ocarinow.github.io/ocai/ .
# Deployment runs ONLY on such pushes and ONLY when Pages is enabled on the
# repository (Settings → Pages → Source: GitHub Actions); until then the
# deploy job reports "skipped" instead of failing. No caching on CI, per
# Zensical's publishing guide.
on:
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * *"
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

# One Pages deployment at a time (never cancel an in-flight deploy); one live
# build per pull request (a new push cancels the superseded one).
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-pr-{0}-{1}', github.event.pull_request.number, (github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base == null) && 'metadata' || 'code') || (github.event_name == 'schedule' && format('docs-full-{0}', github.run_id) || 'pages') }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Route before expanding the reusable workflow. Skipped events display this
# static caller name, never an unevaluated expression or a required check name.
jobs:
  checks:
    name: Documentation
    if: github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base != null
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs-checks.yml
