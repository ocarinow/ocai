name: Docs

# Builds the Zensical documentation site. Pull requests that touch the docs
# get a build check; a push to main that touches the docs builds again and
# deploys the result to GitHub Pages at https://ocarinow.github.io/ocai/ .
# Deployment runs ONLY on such pushes and ONLY when Pages is enabled on the
# repository (Settings → Pages → Source: GitHub Actions); until then the
# deploy job reports "skipped" instead of failing. No caching on CI, per
# Zensical's publishing guide.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'zensical.toml'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'zensical.toml'
      - '.github/workflows/docs.yml'

permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deployment at a time; never cancel an in-flight deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4

      - name: Is GitHub Pages enabled on this repository?
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is not enabled; the site builds but will not deploy. Enable it once: Settings → Pages → Source: GitHub Actions."
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.13

      - name: Sync docs group
        run: uv sync --group docs

      - name: Build site
        run: uv run --group docs zensical build --clean

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: deploy
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.build.outputs.pages_enabled == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages is enabled by hand once (the Actions token cannot create the
      # site); this job only runs when the build job found it enabled..
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: false

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
