name: Release

# The stable release (ADR 0010, docs/releasing.md): when the standing Release
# PR (branch `release`) merges into main, tag each released package
# `<name>/v<version>`, create its GitHub Release from its changelog section,
# build it, and publish it to PyPI through trusted publishing (environment
# `pypi`; no token stored). Only packages whose version changed in the merge
# commit are published.

on:
  push:
    branches: [main]
    paths: ["python/packages/*/pyproject.toml"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  changed:
    name: released packages
    if: startsWith(github.event.head_commit.message, 'Release:')
    runs-on: ubuntu-latest
    outputs:
      dirs: ${{ steps.list.outputs.dirs }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Packages whose version changed in this merge
        id: list
        run: |
          dirs=$(git diff --name-only HEAD~1 HEAD -- 'python/packages/*/pyproject.toml' \
            | while read -r f; do
                if git diff HEAD~1 HEAD -- "$f" | grep -qE '^\+version = '; then dirname "$f"; fi
              done | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "dirs=$dirs" >> "$GITHUB_OUTPUT"
          echo "released: $dirs"

  tag:
    name: tags and GitHub releases
    needs: changed
    if: needs.changed.outputs.dirs != '[]'
    runs-on: ubuntu-latest
    # knope release creates the tags and the GitHub Releases through the API.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: knope-dev/action@19617851f9f13ab2f27a05989c55efb18aca3675 # v2.1.2
        with:
          version: 0.23.2
      - name: knope release (tags + GitHub Releases from the changelog sections)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: knope release --verbose

  publish:
    name: publish ${{ matrix.dir }}
    needs: [changed, tag]
    if: needs.changed.outputs.dirs != '[]'
    runs-on: ubuntu-latest
    environment: pypi
    # Trusted publishing needs the OIDC token; only this job gets it.
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJson(needs.changed.outputs.dirs) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # No cache in a publishing job: a poisoned cache would ship (zizmor cache-poisoning).
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: false
      - run: uv python install 3.13
      - name: Build
        env:
          DIR: ${{ matrix.dir }}
        run: uv build --project "$DIR" --out-dir dist
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
          print-hash: true
