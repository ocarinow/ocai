name: Board sync

# The board is a view of the repo. On every push to main that touches the
# plan, and nightly, reconcile the plan table, the PRs, and the project's
# draft cards: create missing cards, derive each card's status from its PR,
# and fail when the plan and the cards disagree (AGENTS.md "The board").
# Cards are draft items on the project; no issues are created.
#
# BOARD_TOKEN: a classic token with `project` (and `repo` to read PRs), or a
# fine-grained token with Projects (write) on the organization and Pull
# requests (read) on this repo. Required: the default token cannot reach
# Projects.
# BOARD_PROJECT_NUMBER: repository variable with the project number.

on:
  push:
    branches: [main]
    paths: ["docs/plans/**", "scripts/board_sync.py", ".github/workflows/board-sync.yml"]
  pull_request:
    types: [opened, reopened, ready_for_review, converted_to_draft, closed, edited]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: board-sync
  cancel-in-progress: false

jobs:
  sync:
    name: board sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Reconcile plan, cards, and board
        env:
          BOARD_TOKEN: ${{ secrets.BOARD_TOKEN }}
          BOARD_PROJECT_NUMBER: ${{ vars.BOARD_PROJECT_NUMBER }}
          REPOSITORY: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -z "$BOARD_TOKEN" ]; then
            echo "::notice::BOARD_TOKEN secret is not set; the board cannot be reached from CI. Set a token with the project scope: gh secret set BOARD_TOKEN -R $REPOSITORY"
            exit 0
          fi
          # The plan is always read from main: a PR branch's plan table is a proposal, not a fact.
          # PR events report findings without failing; pushes to main and the nightly run are strict.
          git fetch -q origin main
          lenient=""; [ "$EVENT" = "pull_request" ] && lenient="--lenient"
          GH_TOKEN="$BOARD_TOKEN" python3 scripts/board_sync.py sync --apply --ref origin/main $lenient
