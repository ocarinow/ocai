# ocai task runner (https://taskfile.dev). Domain-scoped taskfiles live in
# tasks/<domain>.Taskfile.yml; this root file only includes them and keeps a few aliases.
#
# The Taskfiles are a convenience layer over the canonical commands in
# AGENTS.md. Checks run by themselves through the hooks in
# .pre-commit-config.yaml; CI calls the same tools directly.
#
#   task                 # list every task
#   task setup           # once per clone: environment and git hooks
#   task check           # every hook, on the whole repository
#   task py:test         # one domain, one verb
version: "3"

includes:
  serve:
    taskfile: ./tasks/serve.Taskfile.yml
    desc: Local platform services and their dependencies
  py:
    taskfile: ./tasks/python.Taskfile.yml
    desc: Python workspace — environment, formatting, tests
  docs:
    taskfile: ./tasks/docs.Taskfile.yml
    desc: Zensical site — serve, build, check
  privacy:
    taskfile: ./tasks/privacy.Taskfile.yml
    desc: Privacy guard — nothing from a session goes public
  pr:
    taskfile: ./tasks/pr.Taskfile.yml
    desc: Branches, worktrees, pull requests, reviews
  release:
    taskfile: ./tasks/release.Taskfile.yml
    desc: Versions and releases — changesets, bumps, changelogs (ADR 0010)

tasks:
  default:
    desc: List every task
    silent: true
    cmds:
      - task --list

  check:
    desc: Run every hook on the whole repository — the commit checks, then the push checks
    cmds:
      - uv run pre-commit run --all-files
      - uv run pre-commit run --all-files --hook-stage pre-push

  env:
    desc: "Activate an environment: copy .envs/.env.<ENV> to the root .env (task env -- <ENV>); with no argument, list the available ones"
    silent: true
    cmds:
      - |
        env="{{.CLI_ARGS}}"
        if [ -z "$env" ]; then
          echo "available environments (.envs/.env.<ENV>):"
          ls .envs/.env.* 2>/dev/null | sed 's|.envs/.env.|  |' || echo "  (none: create .envs/.env.<ENV>)"
          [ -f .env ] && echo "active: .env ($(wc -l < .env | tr -d ' ') lines)" || echo "active: none"
          exit 0
        fi
        src=".envs/.env.$env"
        if [ ! -f "$src" ]; then
          echo "no such environment: $src"; echo "available:"; ls .envs/.env.* 2>/dev/null | sed 's|.envs/.env.|  |'; exit 1
        fi
        cp "$src" .env && echo "activated $env -> .env ($(wc -l < .env | tr -d ' ') lines)"

  ide:
    desc: Open the multi-root VS Code workspace (one folder per environment, so Pylance uses each project's own venv)
    cmds:
      - code ocai.code-workspace

  setup:
    desc: One-time setup for a fresh clone — environment, docs group, git hooks (commit, commit message, push), gh auth check
    cmds:
      - task: py:sync
      - uv sync --group docs
      # pre-commit refuses to install while an older hooks path is configured.
      - git config --unset-all core.hooksPath || true
      - uv run pre-commit install
      - gh auth status
