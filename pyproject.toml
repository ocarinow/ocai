# uv WORKSPACE ROOT. This is a "virtual" root: it is NOT a published package,
# it only ties the member distributions together for local development.
[tool.uv.workspace]
members = ["python/packages/*"]

# Resolve the in-repo distributions to the local workspace members instead of
# PyPI. This is what makes `ocai[openai]` (extra -> ocai-openai) and the plugin's
# `ocai>=0.1,<0.2` pin both point at the local source trees.
[tool.uv.sources]
ocai = { workspace = true }
ocai-openai = { workspace = true }
ocai-anthropic = { workspace = true }
ocai-deepseek = { workspace = true }
ocai-aws = { workspace = true }
ocai-bedrock = { workspace = true }

# Dev tooling for the whole workspace. Installed by `uv sync` by default.
# respx records HTTP request/response pairs so adapter tests need no live keys
# and no provider SDK mocks (rule 10); pytest-asyncio runs the async transport.
# httpx is listed explicitly because the `ocai` dist ships it behind the [http]
# extra now — the wire tests exercise the HttpxTransport leaf directly.
[dependency-groups]
# jsonschema validates spec/fixtures against spec/schema in tests only — it must
# never become a runtime dependency of any distribution (rule 11).
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6",
    "ruff>=0.6",
    "respx>=0.21",
    "httpx>=0.27",
    "jsonschema>=4.23",
    "import-linter>=2.1",
    "pyright>=1.1.400",
    "mypy>=1.14",
]
docs = [
    "zensical>=0.0.45",
]

# ---------------------------------------------------------------------------
# Tooling config (shared across all members)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
# Vendored agent skills carry their own upstream scripts; they are not ocai code.
extend-exclude = [".agents"]
target-version = "py313"
# One glob, every distribution: adding a package under python/packages needs no edit here.
src = ["python/packages/*/src"]

[tool.ruff.lint]
# "D" makes rule 18 (Google-style docstrings) executable. The D1xx
# undocumented-object rules stay off: coverage is a review judgment, style is
# not (docs/decisions/0001-agent-neutral-repo-layout.md).
# "S" is the flake8-bandit set: subprocess, SQL strings, hard-coded secrets,
# bare `except: pass`, `assert` in production code (stripped under -O).
select = ["E", "F", "I", "UP", "B", "PERF", "D", "S"]
# UP042: we use `(str, Enum)` deliberately rather than `StrEnum`.
ignore = ["UP042", "D1"]

[tool.ruff.lint.per-file-ignores]
# Tests assert (S101), build SQL for disposable databases from test constants
# (S608), spawn Docker and tooling with trusted argv (S603/S607), and name a
# fake secret (S105).
"**/tests/**" = ["S101", "S105", "S603", "S607", "S608"]
# The gate and task scripts exist to spawn git, gh, uv, npm and docker with
# argv the script itself assembles (S603/S607).
"scripts/**" = ["S603", "S607"]
"tasks/**" = ["S603", "S607"]
# The conformance harness is executed by tests and asserts by design.
"python/packages/ocai-core/src/ocai/convert/conformance.py" = ["S101"]
# Passive observers and stream notifications isolate callback failures on
# purpose (comments at the sites); logging there would leak what the
# callback saw (rule 13).
"python/packages/ocai-core/src/ocai/chat/types/stream.py" = ["S110"]
"python/packages/ocai-core/src/ocai/runtime/observe.py" = ["S110"]
# Type-narrowing asserts in production paths; converting them to explicit
# raises is a kernel change tracked as a follow-up, not a tooling change.
"python/packages/ocai-anthropic/src/ocai/anthropic/messages/codec.py" = ["S101"]
"python/packages/ocai-core/src/ocai/runtime/drivers.py" = ["S101"]
# resources.py asserts that an extension key is registered: under `python -O`
# that check vanishes, which is an honesty gap (rule 5) — tracked as a
# follow-up kernel change, not silenced for good.
"python/packages/ocai-core/src/ocai/convert/resources.py" = ["S101"]
"python/packages/ocai-anthropic/src/ocai/anthropic/messages/search.py" = ["S101"]
"platform/services/gateway/app/identity/issuer.py" = ["S101"]
"platform/services/gateway/app/storage/repository.py" = ["S101"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
# ocai is a PEP 420 namespace split across distributions; treat it as first-party
# so imports group correctly regardless of which member you're editing.
known-first-party = ["ocai"]
# One import per line (no `from x import a, b`).
force-single-line = true
# Within a section, sort by type first (CONSTANTS, Classes, then lowercase
# funcs/vars), then lexically.
order-by-type = true

[tool.ruff.format]
# Match the surrounding style: double quotes, spaces, trailing commas honored.
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.pyright]
# Rule 16 made executable for the IDE: nothing may resolve to Unknown.
# Strict mode is what Pylance shows users; CI runs the same configuration.
include = [
    "python/packages/*/src",
    "python/packages/*/tests",
    "examples",
    "scripts",
    "tasks",
]
exclude = ["**/__pycache__", "**/.venv"]
extraPaths = ["examples/ocai-contrib-echo/src"]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"

[tool.mypy]
# Second opinion on the same bar; nearly free because the tree is already
# fully annotated. Namespace package: every distribution's src root is on
# mypy_path and the portions are listed as packages (never `ocai` itself,
# rule 1). mypy takes no globs, so these lists are explicit;
# scripts/workspace_check.py fails the gate when a package is missing here.
strict = true
python_version = "3.13"
namespace_packages = true
explicit_package_bases = true
mypy_path = [
    "examples/ocai-contrib-echo/src",
    "python/packages/ocai-core/src",
    "python/packages/ocai-openai/src",
    "python/packages/ocai-anthropic/src",
    "python/packages/ocai-deepseek/src",
    "python/packages/ocai-aws/src",
    "python/packages/ocai-bedrock/src",
]
packages = [
    "ocai.contrib.echo",
    "ocai.core", "ocai.chat", "ocai.embedding", "ocai.vectorstore",
    "ocai.convert", "ocai.runtime", "ocai.wire", "ocai.openai", "ocai.anthropic", "ocai.deepseek", "ocai.aws", "ocai.bedrock",
]

# Coverage is INFORMATIONAL (no threshold yet): the gate's pytest step and CI
# print a term-missing report over the distributions' sources so untested
# lines are visible; plain `uv run pytest` stays fast and silent about it.
[tool.coverage.run]
source_pkgs = ["ocai"]
branch = true

[tool.coverage.report]
skip_covered = true
show_missing = true
precision = 1

[tool.pytest.ini_options]
testpaths = ["python/packages/*/tests"]
# importlib mode lets sibling distributions ship same-named test modules
# (every distribution carries a test_conformance.py). --strict-markers and
# --strict-config refuse unknown markers and misspelt options.
addopts = "-q --import-mode=importlib --strict-markers --strict-config"
asyncio_mode = "auto"
# A warning is a failure: deprecations in a dependency or in our own code
# surface in the run that introduces them, not in the release that breaks.
filterwarnings = ["error"]

# ---------------------------------------------------------------------------
# Import contracts (architecture §1) — run with `uv run lint-imports`.
# ---------------------------------------------------------------------------
# ocai is a PEP 420 namespace package spread across THREE distributions in one
# venv, so the root packages are the namespace *portions* (the importable
# subpackages), never `ocai` itself (which has no __init__.py by rule 1).
# `include_external_packages` puts httpx in the graph so the forbidden
# contracts can quarantine it; `exclude_type_checking_imports` drops
# `if TYPE_CHECKING:` imports — annotation-only references are erased at
# runtime and carry no layer coupling (WU-01 decision).
[tool.importlinter]
root_packages = [
    "ocai.core",
    "ocai.chat",
    "ocai.embedding",
    "ocai.vectorstore",
    "ocai.convert",
    "ocai.runtime",
    "ocai.wire",
    "ocai.openai",
    "ocai.anthropic",
    "ocai.deepseek",
    "ocai.aws",
    "ocai.bedrock",
]
include_external_packages = true
exclude_type_checking_imports = true

# §1 layer map: an import against the arrows is a build failure. Higher layers
# may import lower ones; the capability contracts are independent siblings
# (`|`) — chat/embedding/vectorstore never import each other.
#
# ignore_imports carries the THREE sanctioned seams:
# 1. `ocai.chat.facade` — the ONE chat module allowed to import
#    convert/runtime/wire (the wire-backed facade; §3.3; named `facade` so
#    the `ocai.chat.model()` factory is never shadowed by a module).
#    WU-07 landed the real imports: only submodule (`.**`) entries exist,
#    because the facade imports specific value modules, never the bare
#    packages (a bare `ocai.wire` import would chain to httpx through its
#    __init__ and break the quarantine contract below).
# 2. The runtime drivers'/binding's documented *deferred* (function-level)
#    imports of `ocai.wire` VALUE modules (http/sse/transport): the package
#    arrow points wire -> runtime, and runtime touches wire value classes
#    only inside the pipeline, never at module import time (WU-01 decision).
# 3. The §3.4 front door (WU-16): `ocai.chat.model()` in `ocai/chat/__init__`
#    composes catalog/binding/host/transport via *function-level* imports
#    only (grimp sees them; exclude_type_checking does not cover them), so
#    the chat package stays import-light and the composition happens at call
#    time through the same value modules the facade uses.
# Every entry matches a real import; unmatched entries error (the default),
# so a stale ignore is itself a build failure.
[[tool.importlinter.contracts]]
name = "Layered architecture: core <- capabilities <- convert <- runtime <- wire"
type = "layers"
layers = [
    "ocai.wire",
    "ocai.runtime",
    "ocai.convert",
    "ocai.chat | ocai.embedding | ocai.vectorstore",
    "ocai.core",
]
ignore_imports = [
    "ocai.chat.facade -> ocai.convert.**",
    "ocai.chat.facade -> ocai.runtime.**",
    "ocai.chat.facade -> ocai.wire.**",
    "ocai.chat -> ocai.convert.catalog",
    "ocai.chat -> ocai.runtime.binding",
    "ocai.chat -> ocai.wire.hosting",
    "ocai.chat -> ocai.wire.transport",
    "ocai.runtime.drivers -> ocai.wire.http",
    # WU-39: deferred host framing selection joins the existing driver/wire seam.
    "ocai.runtime.drivers -> ocai.wire.hosting",
    "ocai.runtime.drivers -> ocai.wire.outcomes",
    "ocai.runtime.drivers -> ocai.wire.transport",
    "ocai.runtime.binding -> ocai.wire.transport",
]

# §1 plugin rule: plugin distributions depend on core + capability contracts +
# convert ONLY — never on wire/runtime/httpx — so an offline audit tool can
# re-convert archived traffic without the ability to make network calls.
# The two ignored imports are the sanctioned §3.4 door-2 seam (WU-16): each
# plugin's `chat_model()` sugar defers `from ocai.chat import model` to call
# time and composes through the core front door — the plugin itself still
# never imports wire/runtime/httpx (importing the plugin stays inert); the
# ignore cuts the call-time chain plugin -> ocai.chat -> (front-door seams).
[[tool.importlinter.contracts]]
name = "Plugins never import ocai.wire, ocai.runtime, or httpx"
type = "forbidden"
source_modules = ["ocai.openai", "ocai.anthropic", "ocai.deepseek", "ocai.aws"]
forbidden_modules = ["ocai.wire", "ocai.runtime", "httpx"]
ignore_imports = [
    "ocai.openai.chat_completions -> ocai.chat",
    "ocai.anthropic.messages -> ocai.chat",
]

# §1 core purity: httpx stays behind the `ocai.wire` extra; every other layer
# is stdlib-only at runtime (rule 11). The ignored imports are the same
# sanctioned deferred value-class seams as on the layered contract — runtime
# and the §3.4 front door reach httpx only through `ocai.wire.transport`,
# lazily, inside the pipeline/factory; any OTHER chain to httpx (direct or
# indirect) still breaks it.
[[tool.importlinter.contracts]]
name = "Only ocai.wire may import httpx"
type = "forbidden"
source_modules = [
    "ocai.core",
    "ocai.chat",
    "ocai.embedding",
    "ocai.vectorstore",
    "ocai.convert",
    "ocai.runtime",
]
forbidden_modules = ["httpx"]
ignore_imports = [
    "ocai.runtime.binding -> ocai.wire.transport",
    "ocai.runtime.drivers -> ocai.wire.transport",
    "ocai.chat -> ocai.wire.transport",
]

[[tool.importlinter.contracts]]
name = "Cloud credentials stay independent of clients and semantic conversion"
type = "forbidden"
source_modules = ["ocai.aws"]
forbidden_modules = ["httpx", "ocai.wire.transport", "ocai.chat", "ocai.convert", "ocai.runtime"]

# Hosting adapters consume public wire values; SDK clients and semantic codecs
# remain separate. No kernel or semantic provider imports a cloud hosting adapter.
[[tool.importlinter.contracts]]
name = "Bedrock host uses values, not clients or semantic codecs"
type = "forbidden"
source_modules = ["ocai.bedrock"]
forbidden_modules = ["httpx", "ocai.wire.transport", "ocai.runtime", "ocai.aws", "ocai.anthropic"]

[[tool.importlinter.contracts]]
name = "Kernel and codecs do not depend on Bedrock hosting"
type = "forbidden"
source_modules = ["ocai.core", "ocai.chat", "ocai.convert", "ocai.runtime", "ocai.wire",
                  "ocai.openai", "ocai.anthropic", "ocai.deepseek", "ocai.aws"]
forbidden_modules = ["ocai.bedrock"]
