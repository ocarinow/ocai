[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# Distribution name is "ocai" — the meta-package / core. Plugin distributions
# ship additional subpackages into the SAME `ocai` namespace.
name = "ocai"
version = "0.1.1"            # library public API version (semver), kept stable
description = "One Common interface for AI: ports & adapters + middleware + a canonical-IR conversion graph. Source-available."
readme = "README.md"
requires-python = ">=3.13"
license = "FSL-1.1-ALv2"     # source-available (FSL → Apache-2.0 after 2 years)
authors = [{ name = "ocai maintainers" }]
keywords = ["llm", "ai", "providers", "adapters", "rag", "interoperability"]
# Zero hard runtime deps: the contract layers are pure stdlib (rule 11), and
# even the wire stack imports httpx lazily inside HttpxTransport, behind the
# [http] extra — importing ocai.core / ocai.convert never requires httpx.
dependencies = []

[project.optional-dependencies]
# The HTTP leaf: ocai owns the wire (no provider SDKs, rule 12); httpx is used
# solely by ocai.wire.transport.HttpxTransport and imported lazily there.
http = ["httpx>=0.27"]

# Extras pull in sibling PLUGIN distributions (Airflow pattern). Each plugin
# adapts a provider via the shared wire stack — never a provider SDK (rule 12).
# `pip install ocai[openai]` and `pip install ocai-openai` resolve to the same wheel.
openai = ["ocai-openai"]
anthropic = ["ocai-anthropic"]
deepseek = ["ocai-deepseek"]

# Convenience aggregate.
all = ["ocai[http,openai,anthropic,deepseek]"]

[project.urls]
Homepage = "https://github.com/ocarinow/ocai"
Source = "https://github.com/ocarinow/ocai"
Documentation = "https://ocarinow.github.io/ocai/"
Changelog = "https://github.com/ocarinow/ocai/blob/main/python/packages/ocai-core/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
# Map src/ocai -> the `ocai` namespace in the wheel. There is intentionally NO
# src/ocai/__init__.py (PEP 420), so sibling distributions can contribute their
# own subpackages into the same namespace.
packages = ["src/ocai"]

# Add the src dir to sys.path on editable installs so the PEP 420 `ocai`
# namespace is discovered and merged across multiple editable distributions.
[tool.hatch.build]
dev-mode-dirs = ["src"]
