# Branches, worktrees, and pull requests. Every task that publishes runs the
# privacy guard first.
version: "3"

vars:
  SCRATCH: '{{.SCRATCH | default "../ocai-worktrees"}}'

tasks:
  worktree:
    desc: New worktree + branch from origin/main (task pr:worktree -- wu-NN-slug)
    cmds:
      - git fetch -q origin
      - git worktree add -b {{.CLI_ARGS}} {{.SCRATCH}}/{{.CLI_ARGS}} origin/main
      - echo "cd {{.SCRATCH}}/{{.CLI_ARGS}} && uv sync"

  stack:
    desc: "New worktree + branch stacked on an unmerged WU branch (task pr:stack -- PARENT_BRANCH NEW_BRANCH)"
    cmds:
      - git fetch -q origin
      - git worktree add -b {{index (splitArgs .CLI_ARGS) 1}} {{.SCRATCH}}/{{index (splitArgs .CLI_ARGS) 1}} {{index (splitArgs .CLI_ARGS) 0}}
      - echo "cd {{.SCRATCH}}/{{index (splitArgs .CLI_ARGS) 1}} && uv sync; open the PR with base {{index (splitArgs .CLI_ARGS) 0}} and body 'Stacked on #<parent PR>'"

  restack:
    desc: "After the parent PR merged (squash), rebase this branch onto origin/main dropping the parent's commits (task pr:restack -- PARENT_BRANCH)"
    cmds:
      - git fetch -q origin
      - git rebase --onto origin/main {{.CLI_ARGS}}
      - uv run python scripts/privacy_check.py --no-files
      - git push --force-with-lease
      - gh pr edit --base main

  worktree:rm:
    desc: Remove a worktree and its local branch after merge (task pr:worktree:rm -- wu-NN-slug)
    cmds:
      - git worktree remove --force {{.SCRATCH}}/{{.CLI_ARGS}}
      - git branch -D {{.CLI_ARGS}}
      - git fetch -p -q origin

  rebase:
    desc: Rebase the current branch onto origin/main and force-push with lease
    cmds:
      - git fetch -q origin
      - git rebase origin/main
      - git push --force-with-lease

  open:
    desc: "Open a PR from a body file written against the template (task pr:open -- \"Topic: title\" BODYFILE [draft]); hygiene and privacy are checked before anything is pushed"
    cmds:
      - uv run python scripts/pr_check.py --title "{{index (splitArgs .CLI_ARGS) 0}}" --body-file {{index (splitArgs .CLI_ARGS) 1}}{{if gt (len (splitArgs .CLI_ARGS)) 2}} --draft{{end}}
      - uv run python scripts/privacy_check.py --no-files --range HEAD..HEAD --text {{index (splitArgs .CLI_ARGS) 1}}
      - uv run python scripts/privacy_check.py --no-files
      - git push -u origin HEAD
      - gh pr create --base main --head "$(git branch --show-current)" --title "{{index (splitArgs .CLI_ARGS) 0}}" --body-file {{index (splitArgs .CLI_ARGS) 1}}{{if gt (len (splitArgs .CLI_ARGS)) 2}} --draft{{end}}

  checks:
    desc: Watch the checks of a PR until they finish (task pr:checks -- NN)
    cmds:
      - gh pr checks {{.CLI_ARGS}} --watch --interval 10

  status:
    desc: Open PRs with merge state and the required checks
    silent: true
    cmds:
      - gh pr list --state open --json number,title,mergeStateStatus,isDraft,statusCheckRollup --jq '.[] | "#\(.number)  \(.mergeStateStatus)\(if .isDraft then " draft" else "" end)  " + ([.statusCheckRollup[]? | select(.name=="python" or .name=="privacy") | .name + ":" + (.conclusion // .status)] | join(",")) + "  \(.title)"'

  review:
    desc: Review a PR in a scratch worktree with every hook run on it (task pr:review -- NN); see the review-pr skill
    cmds:
      - git fetch -q origin
      - |
        head=$(gh pr view {{.CLI_ARGS}} --json headRefName -q .headRefName)
        dir={{.SCRATCH}}/review-pr-{{.CLI_ARGS}}
        git worktree add --detach "$dir" "origin/$head"
        echo "review worktree: $dir"
        (cd "$dir" && uv sync -q && git diff origin/main...HEAD --stat && uv run pre-commit run --all-files && uv run pre-commit run --all-files --hook-stage pre-push) || true
        echo "when done: git worktree remove --force $dir"

  post-review:
    desc: Post a review file as a comment review after the privacy scan (task pr:post-review -- NN FILE)
    cmds:
      - uv run python scripts/privacy_check.py --no-files --range HEAD..HEAD --text {{index (splitArgs .CLI_ARGS) 1}}
      - gh pr review {{index (splitArgs .CLI_ARGS) 0}} --comment --body-file {{index (splitArgs .CLI_ARGS) 1}}
