# Zensical documentation site. The docs dependency group holds zensical; the
# published site is deployed by .github/workflows/docs.yml on pushes to main.
version: "3"

tasks:
  serve:
    desc: Live preview at http://127.0.0.1:8000 (rebuilds on save)
    cmds:
      - uv run --group docs zensical serve {{.CLI_ARGS}}

  build:
    desc: Render the static site into ./site (gitignored), exactly as the deploy job does
    cmds:
      - uv run --group docs zensical build --clean

  check:
    desc: Build and fail on any warning (missing nav page, broken link) — the gate's docs step
    cmds:
      - uv run python scripts/docs_check.py

  orphans:
    desc: Check user navigation coverage and documentation link boundaries
    cmds:
      - uv run python scripts/docs_contract.py

  clean:
    desc: Remove the built site
    cmds:
      - rm -rf site
