# The GitHub Project board (AGENTS.md "The board"): a view of the repo, holding
# draft cards only (never issues), moved by scripts/board_sync.py alone.
# Needs a token with the project scope (gh auth refresh -s project) and
# BOARD_PROJECT_NUMBER (repository variable; export it locally or pass --project).
version: "3"

env:
  BOARD_PROJECT_NUMBER: '{{.BOARD_PROJECT_NUMBER | default "8"}}'

tasks:
  sync:
    desc: Report plan ↔ PRs ↔ cards differences (exit 1 when out of sync)
    cmds:
      - uv run python scripts/board_sync.py sync {{.CLI_ARGS}}

  sync:apply:
    desc: Create missing cards and set statuses from the facts
    cmds:
      - uv run python scripts/board_sync.py sync --apply {{.CLI_ARGS}}

  card:
    desc: "Add a WU card now (task board:card -- \"WU-NN: title\"); the sync would create it anyway"
    cmds:
      - uv run python scripts/board_sync.py add wu "{{.CLI_ARGS}}"

  set:
    desc: "Set Owner and/or Tier on a WU card (task board:set -- WU-NN --owner Claude --tier \"1 chat completeness and hosts\")"
    cmds:
      - uv run python scripts/board_sync.py set {{.CLI_ARGS}}

  decision:
    desc: "Add a decision card in Blocked on maintainer (task board:decision -- \"Decision: question\" BODYFILE); see maintainer-handoff"
    cmds:
      - uv run python scripts/privacy_check.py --no-files --range HEAD..HEAD --text {{index (splitArgs .CLI_ARGS) 1}}
      - uv run python scripts/board_sync.py add decision "{{index (splitArgs .CLI_ARGS) 0}}" --body-file {{index (splitArgs .CLI_ARGS) 1}}

  gap:
    desc: "Add a kernel-gap card mirroring a gaps.md row (task board:gap -- \"Gap: what\" BODYFILE)"
    cmds:
      - uv run python scripts/privacy_check.py --no-files --range HEAD..HEAD --text {{index (splitArgs .CLI_ARGS) 1}}
      - uv run python scripts/board_sync.py add gap "{{index (splitArgs .CLI_ARGS) 0}}" --body-file {{index (splitArgs .CLI_ARGS) 1}}

  open:
    desc: Open the board in the browser
    cmds:
      - gh project view $BOARD_PROJECT_NUMBER --owner ocarinow --web
